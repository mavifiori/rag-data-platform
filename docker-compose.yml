version: '3.8'

services:
  # --- BANCO DE DADOS (PostgreSQL + pgvector) ---
  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: rag_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- ARMAZENAMENTO DE OBJETOS (MinIO) ---
  minio:
    image: minio/minio:latest
    container_name: rag_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # --- LLM LOCAL (Ollama) ---
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: ["serve"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/ >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- SERVIÇO 1: FastAPI ---
  api:
    image: python:3.11-slim
    container_name: rag_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/rag_db"
      MINIO_ENDPOINT: "minio:9000"
      OLLAMA_ENDPOINT: "http://ollama:11434"
      PYTHONPATH: "/app/src"
    volumes:
      - .:/app
    command: sh -c "pip install --no-cache-dir -r /app/requirements.txt && uvicorn services.api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      ollama:
        condition: service_started

  # --- SERVIÇO 2: Worker de Ingestão de Dados ---
  ingestion:
    image: python:3.11-slim
    container_name: rag_ingestion
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/rag_db"
      MINIO_ENDPOINT: "minio:9000"
      PYTHONPATH: "/app/src"
    volumes:
      - .:/app
    command: sh -c "pip install --no-cache-dir -r /app/requirements.txt && python /app/src/pipelines/run_ingestion.py"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  # --- SERVIÇO 3: Front-end com Streamlit ---
  frontend:
    image: python:3.11-slim
    container_name: rag_frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: "http://api:8000"
      PYTHONPATH: "/app/src"
    volumes:
      - .:/app  
    command: sh -c "pip install --no-cache-dir -r /app/requirements.txt && python -m streamlit run /app/src/frontend/app.py --server.port=8501 --server.address=0.0.0.0"
    depends_on:
      api:
        condition: service_started

# --- VOLUMES GLOBAIS ---
volumes:
  postgres_data:
  minio_data:
  ollama_data:
name: Data Platform CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do repositório para a máquina do GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Configura o ambiente Python correto (alinhado com o nosso Dockerfile)
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-node-version: '3.11'

    # 3. Cria um cache para as dependências (faz o pipeline rodar muito mais rápido)
    - name: Cache Python packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4. Instala as dependências do projeto
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 5. Valida as boas práticas de escrita de código (PEP 8)
    # Evita que códigos mal formatados ou com variáveis órfãs vão para produção
    - name: Lint with flake8
      run: |
        # para o build se houver erros de sintaxe Python
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # avisos gerais saem como warning sem quebrar o build
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 6. Configura o PYTHONPATH para que os testes encontrem a pasta 'src'
    # Executa os testes automatizados que você criar na pasta /tests
    - name: Run Tests
      env:
        PYTHONPATH: src
      run: |
        # Executa o pytest olhando para a pasta de testes
        # (Adicione a flag -v para ver detalhes)
        pytest tests/ --doctest-modules
name: Data Platform CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'          # ← BUG 1 CORRIGIDO

    - name: Cache Python packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt  # ← sem 'if', agora o arquivo existe

    - name: Lint with flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Tests
      env:
        PYTHONPATH: ${{ github.workspace }}/src   # ← caminho absoluto
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/rag_db"  # ← BUG 6
        MINIO_ENDPOINT: "localhost:9000"
        OLLAMA_ENDPOINT: "http://localhost:11434"
      run: |
        pytest tests/ -v --tb=short               # ← sem --doctest-modules